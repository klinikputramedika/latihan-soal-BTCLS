<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Latihan Soal BTCLS Klinik Putra Medika"
    >

    <title>Latihan BTCLS | Klinik Putra Medika</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="quiz-header">

    <div class="quiz-header-inner">

        <div class="brand">

            <div class="brand-icon">
                BT
            </div>

            <div>

                <h1>
                    BTCLS Practice
                </h1>

                <span>
                    Klinik Putra Medika
                </span>

            </div>

        </div>


        <div class="quiz-score-box">

            <span>
                Score
            </span>

            <strong id="current-score">
                0
            </strong>

        </div>

    </div>

</header>



<main class="quiz-container">


    <section class="quiz-progress">

        <div class="progress-info">

            <span id="question-number">
                Soal 1
            </span>

            <span id="progress-text">
                1 / 100
            </span>

        </div>


        <div class="progress-track">

            <div
                id="progress-bar"
                class="progress-bar"
            ></div>

        </div>

    </section>



    <section class="question-card">


        <div
            id="question-topic"
            class="question-topic"
        >
            BTCLS
        </div>


        <h2
            id="question-text"
            class="question-text"
        >
            Memuat soal...
        </h2>


        <div
            id="options-container"
            class="options-container"
        >
        </div>


        <div class="quiz-navigation">

            <button
                id="btn-skip"
                class="btn btn-secondary"
                type="button"
            >
                Lewati →
            </button>


            <button
                id="btn-next"
                class="btn btn-primary"
                type="button"
            >
                Berikutnya →
            </button>

        </div>

    </section>



    <section class="quiz-info">


        <div class="info-item">

            <span class="info-icon">
                ✓
            </span>

            <div>

                <strong>
                    Pilih Jawaban
                </strong>

                <small>
                    Jawaban langsung dinilai
                </small>

            </div>

        </div>


        <div class="info-item">

            <span class="info-icon">
                →
            </span>

            <div>

                <strong>
                    Lewati Soal
                </strong>

                <small>
                    Soal tetap dihitung
                </small>

            </div>

        </div>


        <div class="info-item">

            <span class="info-icon">
                100
            </span>

            <div>

                <strong>
                    100 Soal
                </strong>

                <small>
                    Nilai akhir 0–100
                </small>

            </div>

        </div>


    </section>


</main>



<script src="js/questions.js"></script>

<script src="js/quiz.js"></script>


</body>

</html>
